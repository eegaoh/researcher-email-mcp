name: Researcher synthetic checks
on:
  push:
    branches: [main, codex/local-review-tool]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run privacy:check
      - run: node scripts/stdio-smoke.mjs
      - run: npm run test:researcher
      - run: npm audit --omit=dev --audit-level=high
